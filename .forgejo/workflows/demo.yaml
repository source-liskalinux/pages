name: Sync Liska DB Repository

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codeberg Repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Sync Script
        run: node sync.js
      - name: Commit and Push Updated db.json
        run: |
          git config --global user.name "janorovicvolkov"
          git config --global user.email "janorovicvolkov@gmail.com"
          git add core/db.json extra/db.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated 24h repo sync [skip ci]" && git push)